[package]
name = "taste-curator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first taste elicitation and machine-actionable PDF export, built with Rune."

[workspace]
members = [".", "native"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", features = ["tooling"] }
krilla = "0.8"
hayro = "0.9"
hayro-syntax = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
parley = "0.12"

[patch.crates-io]
parley_engine = { path = "vendor/parley_engine" }
# Rune's own `[patch]` doesn't reach a workspace that merely depends on it, so an app building
# Rune must vendor these too: on Windows, winit's taskbar and first-frame placement fixes, and
# wgpu-hal's DX12 adapter pick, FXC load and partial presents (both are what Rune's Windows
# backend is written against).
winit = { path = "vendor/winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }
