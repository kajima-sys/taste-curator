[package]
name = "taste-curator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first taste elicitation and machine-actionable PDF export, built with Rune."

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", features = ["tooling"] }
krilla = "0.8"
hayro = "0.9"
hayro-syntax = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
parley = "0.12"

[patch.crates-io]
parley_engine = { path = "vendor/parley_engine" }
