[package]
name = "taste-curator"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local-first taste elicitation and machine-actionable PDF export, built with Rune."

[workspace]
members = [".", "native"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", features = ["tooling"] }
krilla = "0.8"
hayro = "0.9"
hayro-syntax = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
parley = "0.12"
# HTML is rendered to pixels in pure Rust: Blitz parses the markup, resolves the CSS through
# Servo's style engine and paints offscreen. Only the DOM/paint crates are used, never
# `blitz-shell` (a window) or `blitz-net` (which pulls in an HTTP stack and OpenSSL) — pages
# read their own files from disk instead. `vello_cpu` is the software rasteriser.
blitz-dom = { version = "0.3.0-beta.4", default-features = false }
blitz-html = "0.3.0-beta.4"
blitz-paint = { version = "0.3.0-beta.4", default-features = false }
blitz-traits = "0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"

[patch.crates-io]
parley_engine = { path = "vendor/parley_engine" }
# Rune's own `[patch]` doesn't reach a workspace that merely depends on it, so an app building
# Rune must vendor these too: on Windows, winit's taskbar and first-frame placement fixes, and
# wgpu-hal's DX12 adapter pick, FXC load and partial presents (both are what Rune's Windows
# backend is written against).
winit = { path = "vendor/winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }

# `rune-taffy` packs taffy's styles into bitfields with exhaustive matches over `FlexWrap`.
# Rendering HTML turns on taffy's `flexbox_balance` feature, which adds two variants, so the
# vendored copy handles them (folding them into plain wraps: they occupy the same two bits).
# Nothing else in it changes.
[patch."https://github.com/anomalyco/rune"]
rune-taffy = { path = "vendor/rune-taffy" }

# HTML rendering brings a CSS engine into the build, and a default debug build of the workspace
# plus Rune no longer fits in this VM's 16 GB disk. Debug info is what makes it huge and it is
# not needed to develop or test: keep line numbers for backtraces, drop the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
