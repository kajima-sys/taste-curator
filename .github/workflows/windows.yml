name: Windows app

# Builds the native Rune app on Windows and attaches a zip to each release (and to manual
# runs). Everything a Windows 11 machine needs is inside the zip: the exe plus the sample
# project, so the first launch has something to show.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build the native app
        run: cargo build --release -p taste-curator-native

      - name: Run the native tests
        run: cargo test --release -p taste-curator-native

      - name: Render a smoke-test frame
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item seed dist/seed -Recurse
          # Headless render proves the built exe starts and draws on this platform.
          $env:HOME = "$env:RUNNER_TEMP\home"
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          # The exe is a GUI-subsystem app, so PowerShell must be told to wait for it.
          $p = Start-Process -FilePath target/release/taste-curator-native.exe -Wait -PassThru `
            -ArgumentList "--snap", "dist/smoke.png", "--scene", "project", "--size", "1180x760"
          if ($p.ExitCode -ne 0) { throw "the app exited with $($p.ExitCode)" }
          if (-not (Test-Path dist/smoke.png)) { throw "the app did not render a frame" }

      - name: Render the sample web page
        shell: pwsh
        run: |
          # HTML rendering needs the bundled fonts and a real page layout, so prove both work
          # in the built binary rather than only in the test suite.
          Copy-Item assets dist/assets -Recurse
          $env:HOME = "$env:RUNNER_TEMP\home2"
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          $p = Start-Process -FilePath target/release/taste-curator-native.exe -Wait -PassThru `
            -ArgumentList "--script", "native/scripts/html.json", "--scene", "empty", "--at", "mark:page", "--snap", "dist/page.png"
          if ($p.ExitCode -ne 0) { throw "the app exited with $($p.ExitCode) rendering a page" }
          if (-not (Test-Path dist/page.png)) { throw "the web page did not render" }
          # A blank or white-on-white render would still be a PNG file, so check it has ink.
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Bitmap]::FromFile((Resolve-Path dist/page.png))
          $dark = 0
          for ($x = 0; $x -lt $img.Width; $x += 7) {
            for ($y = 0; $y -lt $img.Height; $y += 7) {
              $c = $img.GetPixel($x, $y)
              if ($c.R -gt 120 -and $c.G -gt 200 -and $c.B -lt 170) { $dark++ }
            }
          }
          $img.Dispose()
          if ($dark -lt 5) { throw "the page rendered without its text or colours" }
          Write-Host "page rendered with $dark accent-coloured samples"

      - name: Assemble the zip
        shell: pwsh
        run: |
          Copy-Item target/release/taste-curator-native.exe dist/TasteCurator.exe
          Copy-Item README.md dist/README.md
          # `assets/fonts` must travel with the exe: HTML pages render with these fonts, and the
          # build machine's paths do not exist on the user's PC.
          if (-not (Test-Path dist/assets/fonts/Inter-Regular.ttf)) { throw "the bundled fonts are missing" }
          Compress-Archive -Path dist/TasteCurator.exe, dist/README.md, dist/seed, dist/assets -DestinationPath TasteCurator-windows.zip
          Get-ChildItem TasteCurator-windows.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TasteCurator-windows
          path: TasteCurator-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" TasteCurator-windows.zip --clobber
