<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste Curator — exported plates</title>
<style>
  @font-face {
    font-family: Inter;
    src: url("fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: Inter;
    src: url("fonts/Inter-Medium.ttf") format("truetype");
    font-weight: 500;
    font-display: swap;
  }
  :root {
    --ink: #16161a;
    --muted: #6e6e78;
    --hair: #dedee4;
    --paper: #f5f4f1;
    --card: #ffffff;
    --like: #248a5c;
    --avoid: #c03a3a;
    --contrast: #4860c8;
    --shadow: 0 1px 2px rgba(22,22,26,.06), 0 12px 32px rgba(22,22,26,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; height: auto; }
    /* On a phone the plates come first; the written read follows them. */
    main { order: 1; }
    aside { order: 2; }
  }

  aside {
    border-right: 1px solid var(--hair);
    background: #fbfaf8;
    padding: 26px 22px 40px;
    overflow-y: auto;
    height: 100%;
  }
  @media (max-width: 900px) { aside { height: auto; border-right: 0; border-top: 1px solid var(--hair); } }
  .kicker {
    font: 500 10px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 { font-size: 22px; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 6px; font-weight: 500; }
  .lede { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  h2 {
    font: 500 10px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 24px 0 10px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .line { display: flex; gap: 9px; padding: 7px 0; border-bottom: 1px solid #eceae6; font-size: 13px; }
  .line:last-child { border-bottom: 0; }
  .dot { width: 7px; height: 7px; border-radius: 2px; margin-top: 6px; flex: none; background: var(--muted); }
  .dot.like { background: var(--like); }
  .dot.avoid { background: var(--avoid); }
  .conflict { border-left: 2px solid var(--avoid); padding: 2px 0 2px 10px; margin: 8px 0; font-size: 13px; }
  .files { display: grid; gap: 8px; margin-top: 10px; }
  .files a {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 9px 11px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--card); color: var(--ink); text-decoration: none; font-size: 13px;
  }
  .files a:hover { border-color: #c6c6d0; }
  .files span { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--muted); margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--hair); }

  main { overflow-y: auto; height: 100%; padding: 30px 34px 60px; }
  @media (max-width: 900px) { main { height: auto; padding: 24px 16px 40px; } }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .bar .title { font-size: 13px; color: var(--muted); }
  .pill {
    font: 500 11px/1 ui-sans-serif, system-ui, sans-serif;
    padding: 6px 9px; border-radius: 999px; background: #eceae6; color: #4a4a54;
  }
  .pill.open { background: #e7f1ec; color: #1d6b48; }
  .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--hair); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #c6c6d0; background: #fdfcfa; }
  button:disabled { opacity: .4; cursor: default; }
  .count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 62px; text-align: center; }

  .stage { display: flex; justify-content: center; }
  .sheet {
    width: min(100%, 760px);
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 3px;
    overflow: hidden;
    line-height: 0;
  }
  .sheet img { width: 100%; height: auto; display: block; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 18px 4px 8px; }
  .thumb {
    flex: none; width: 74px; padding: 0; border-radius: 2px; line-height: 0;
    border: 1px solid var(--hair); background: #fff; cursor: pointer; overflow: hidden;
    opacity: .55; transition: opacity .15s, border-color .15s;
  }
  .thumb img { width: 100%; display: block; }
  .thumb:hover { opacity: .85; }
  .thumb.active { opacity: 1; border-color: var(--ink); }
  .caption { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="kicker">Taste Curator</div>
    <h1 id="project">…</h1>
    <p class="lede">What the exporter writes from eight markings on three images.</p>

    <h2>Read this first</h2>
    <ul id="summary"></ul>

    <h2>Conflicts kept on purpose</h2>
    <div id="conflicts"></div>

    <h2>Files</h2>
    <div class="files">
      <a href="taste-curator.pdf" target="_blank">The PDF <span id="pdfsize"></span></a>
      <a href="manifest.json" target="_blank">Embedded data <span>JSON</span></a>
    </div>

    <p class="note" id="note"></p>
  </aside>

  <main>
    <div class="bar">
      <span class="pill open">Exported</span>
      <span class="title" id="pagetitle"></span>
      <div class="nav">
        <button id="prev" aria-label="Previous plate">←</button>
        <span class="count" id="count"></span>
        <button id="next" aria-label="Next plate">→</button>
      </div>
    </div>
    <div class="stage"><div class="sheet"><img id="page" alt=""></div></div>
    <div class="strip" id="strip"></div>
    <p class="caption" id="caption"></p>
  </main>
</div>

<script>
const TITLES = ['Synthesis', 'Overview', 'Detail'];
let pages = [], index = 0;

function titleFor(i) {
  if (i === 0) return 'Synthesis — the whole read';
  if (data.titles && data.titles[i]) return data.titles[i];
  return 'Plate ' + (i + 1);
}

let data = {};

async function boot() {
  const res = await fetch('pages.json');
  data = await res.json();
  pages = data.pages;
  document.getElementById('project').textContent = data.project;

  const summary = document.getElementById('summary');
  for (const line of data.summary) {
    const li = document.createElement('li');
    li.className = 'line';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (/^Like/.test(line) ? 'like' : /Must avoid/.test(line) ? 'avoid' : '');
    const text = document.createElement('span');
    text.textContent = line;
    li.append(dot, text);
    summary.append(li);
  }

  const conflicts = document.getElementById('conflicts');
  if (!data.conflicts.length) {
    conflicts.innerHTML = '<p class="lede">None — every like and dislike is in a different scope or medium.</p>';
  } else {
    for (const c of data.conflicts) {
      const p = document.createElement('p');
      p.className = 'conflict';
      p.textContent = c;
      conflicts.append(p);
    }
  }

  document.getElementById('pdfsize').textContent = data.pdf_bytes ? Math.round(data.pdf_bytes / 1024) + ' KB' : '';
  document.getElementById('note').textContent = data.note || '';
  document.getElementById('pagetitle').textContent = data.readings + ' markings across ' + data.artifacts.length + ' sources';

  const strip = document.getElementById('strip');
  pages.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.title = titleFor(i);
    const img = document.createElement('img');
    img.src = 'pages/' + name;
    img.alt = titleFor(i);
    b.append(img);
    b.onclick = () => show(i);
    strip.append(b);
  });

  document.getElementById('prev').onclick = () => show(index - 1);
  document.getElementById('next').onclick = () => show(index + 1);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(index + 1);
    if (e.key === 'ArrowLeft') show(index - 1);
  });

  const wanted = new URLSearchParams(location.search).get('page');
  show(wanted ? Math.min(parseInt(wanted, 10) - 1 || 0, pages.length - 1) : 0);
}

function show(i) {
  if (i < 0 || i >= pages.length) return;
  index = i;
  document.getElementById('page').src = 'pages/' + pages[i];
  document.getElementById('count').textContent = (i + 1) + ' / ' + pages.length;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === pages.length - 1;
  document.getElementById('caption').textContent = titleFor(i);
  [...document.getElementById('strip').children].forEach((el, j) => el.classList.toggle('active', j === i));
  document.getElementById('strip').children[i]?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  const url = new URL(location.href);
  url.searchParams.set('page', i + 1);
  history.replaceState(null, '', url);
}

boot();
</script>
</body>
</html>
